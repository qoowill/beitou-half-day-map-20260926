<style>#beitou-trip-map{--ink:#263238;--soft:#fffaf2;--cream:#f4ead8;--coral:#df765e;--teal:#4f8f8a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);max-width:820px;margin:auto;background:var(--soft);border-radius:24px;overflow:hidden;box-shadow:0 14px 40px rgba(73,52,31,.12)}#beitou-trip-map *{box-sizing:border-box}.hero{padding:26px;background:linear-gradient(135deg,#f7d9c8,#f8edcf 55%,#d8eee6)}.eyebrow{font-size:12px;letter-spacing:.16em;color:#8d5a48;font-weight:600}.hero h1{font-size:29px;line-height:1.2;margin:8px 0 7px;font-weight:600}.sub{margin:0;color:#5f6866;font-size:14px}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{background:#ffffffaa;padding:7px 11px;border-radius:999px;font-size:12px;color:#5d5145}.map{padding:22px 22px 8px;background:var(--cream)}.map-title{display:flex;justify-content:space-between;margin:0 4px 12px;font-size:14px;font-weight:600}.map-title span{font-size:12px;color:#85786a;font-weight:400}.route-svg{width:100%;display:block}.route-svg text{font-family:inherit;fill:var(--ink)}.route-svg .road{fill:none;stroke:#e0cfae;stroke-width:22;stroke-linecap:round}.route-svg .line{fill:none;stroke:var(--coral);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 10}.route-svg .water{fill:#cde7e1;opacity:.8}.route-svg .node{cursor:pointer}.route-svg .dot{fill:var(--soft);stroke:var(--coral);stroke-width:3}.route-svg .node.active .dot{fill:var(--coral);stroke:var(--soft);stroke-width:5}.route-svg .num{font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central}.route-svg .label{font-size:12px;font-weight:600}.route-svg .time{font-size:10px;fill:#7d7164}.route-svg .landmark{font-size:24px;text-anchor:middle}.info{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;padding:18px 22px 22px;background:var(--soft)}.panel{background:#fff;border-radius:18px;padding:18px;border:1px solid #5741281a}.panel h2{font-size:18px;margin:0 0 6px;font-weight:600}.kind{font-size:12px;color:var(--coral);font-weight:600;letter-spacing:.08em}.panel p{font-size:14px;line-height:1.65;margin:9px 0;color:#5c625e}.go{display:inline-block;text-decoration:none;background:var(--teal);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:600}.side-title{font-size:13px;font-weight:600;margin-bottom:9px}.route-list{display:grid;gap:7px}.route-list button{border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:10px;color:var(--ink);cursor:pointer;font:inherit;font-size:12px;display:flex;justify-content:space-between;gap:8px}.route-list button:hover,.route-list button.active{background:#f8e3d9}.route-list .rt{color:#927767;white-space:nowrap}.foot{padding:0 22px 20px;background:var(--soft);font-size:12px;color:#8a7c6d}@media(max-width:600px){.hero{padding:22px 18px}.hero h1{font-size:25px}.map{padding:18px 10px 6px;overflow-x:auto}.route-svg{min-width:560px}.info{grid-template-columns:1fr;padding:15px 14px 18px}.foot{padding:0 16px 18px}}</style>
<section class="hero"><div class="eyebrow">SATURDAY · 9/26 · HALF DAY ESCAPE</div><h1>汐止出發，去北投散步</h1><p class="sub">一條不趕路的溫泉街半日行程｜早午餐・公園・地熱谷・咖啡</p><div class="pills"><span class="pill">🚆 火車＋捷運</span><span class="pill">☕ 咖啡 2 小時</span><span class="pill">↩ 18:00 前回家</span></div></section>
<section class="map"><div class="map-title">今日路線 <span>點擊地圖上的圓點查看行程</span></div><svg class="route-svg" viewBox="0 0 760 270" role="img" aria-label="從汐止到北投的行程示意路線"><path class="water" d="M0 220C160 170 270 245 430 198S650 175 760 210V270H0Z"/><path class="road" d="M55 190C135 90 190 80 270 132S380 230 452 154S560 62 704 102"/><path class="line" d="M55 190C135 90 190 80 270 132S380 230 452 154S560 62 704 102"/><text x="90" y="245" class="landmark">🚆</text><text x="640" y="47" class="landmark">♨</text><g class="node active" data-i="0" transform="translate(55 190)"><circle class="dot" r="18"/><text class="num">1</text><text class="label" x="-12" y="-30">汐止</text><text class="time" x="-12" y="-17">08:20</text></g><g class="node" data-i="1" transform="translate(185 92)"><circle class="dot" r="18"/><text class="num">2</text><text class="label" x="-18" y="-30">新北投</text><text class="time" x="-18" y="-17">10:25</text></g><g class="node" data-i="2" transform="translate(270 132)"><circle class="dot" r="18"/><text class="num">3</text><text class="label" x="-20" y="-30">早安勇士</text><text class="time" x="-20" y="-17">10:30</text></g><g class="node" data-i="3" transform="translate(370 205)"><circle class="dot" r="18"/><text class="num">4</text><text class="label" x="-28" y="35">公園／博物館</text><text class="time" x="-28" y="48">11:40</text></g><g class="node" data-i="4" transform="translate(452 154)"><circle class="dot" r="18"/><text class="num">5</text><text class="label" x="-16" y="-30">地熱谷</text><text class="time" x="-16" y="-17">13:00</text></g><g class="node" data-i="5" transform="translate(565 68)"><circle class="dot" r="18"/><text class="num">6</text><text class="label" x="-16" y="-30">豆咖啡</text><text class="time" x="-16" y="-17">14:00</text></g><g class="node" data-i="6" transform="translate(704 102)"><circle class="dot" r="18"/><text class="num">7</text><text class="label" x="-28" y="-30">回汐止</text><text class="time" x="-28" y="-17">16:30</text></g></svg></section>
<section class="info"><div class="panel"><div class="kind" id="trip-kind">出發</div><h2 id="trip-title">家裡 → 汐止火車站</h2><p id="trip-copy">從新台五路搭公車到汐止火車站，再搭往台北方向的臺鐵。建議 08:20 左右出發。</p><a class="go" id="trip-link" href="https://www.google.com/maps/dir/?api=1&origin=新台五路汐止&destination=汐止火車站&travelmode=transit" target="_blank" rel="noopener">開啟這一段導航 ↗</a></div><div class="panel"><div class="side-title">行程節奏</div><div class="route-list" id="route-list"></div></div></section><div class="foot">☔ 明日上午 10–11 點可能有短暫陣雨，帶傘；建議 16:30 前回到新北投站，18:00 前回家。</div>
<script>(()=>{const d=[['出發','家裡 → 汐止火車站','從新台五路搭公車到汐止火車站，再搭往台北方向的臺鐵。建議 08:20 左右出發。','https://www.google.com/maps/dir/?api=1&origin=新台五路汐止&destination=汐止火車站&travelmode=transit'],['交通','台北車站 → 新北投站','臺鐵到台北後，搭淡水信義線到北投，再轉新北投支線。','https://www.google.com/maps/dir/?api=1&origin=台北車站&destination=新北投捷運站&travelmode=transit'],['早午餐','早安勇士','10:30–11:40。份量足，週六營業；熱門時段可能候位。','https://www.google.com/maps/dir/?api=1&origin=新北投捷運站&destination=早安勇士+北投&travelmode=walking'],['散步','北投公園／圖書館／溫泉博物館','11:40–13:00。景點集中，慢慢走即可。','https://www.google.com/maps/dir/?api=1&origin=早安勇士+北投&destination=北投溫泉博物館&travelmode=walking'],['景點','地熱谷','13:00–14:00。從溫泉博物館步行約 15–20 分鐘。','https://www.google.com/maps/dir/?api=1&origin=北投溫泉博物館&destination=地熱谷&travelmode=walking'],['咖啡','豆咖啡 BEANCAFE','14:00–16:30。虹吸咖啡、手沖與甜點；週六通常營業。','https://www.google.com/maps/dir/?api=1&origin=地熱谷&destination=豆咖啡+BEANCAFE+北投&travelmode=walking'],['回程','豆咖啡 → 汐止','16:30 離開，走回新北投站，搭捷運到台北再轉臺鐵，預留回家交通時間。','https://www.google.com/maps/dir/?api=1&origin=豆咖啡+BEANCAFE+北投&destination=汐止火車站&travelmode=transit']];const ns=[...document.querySelectorAll('#beitou-trip-map .node')],ls=document.getElementById('route-list'),kind=document.getElementById('trip-kind'),title=document.getElementById('trip-title'),copy=document.getElementById('trip-copy'),link=document.getElementById('trip-link');d.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span>'+x[1]+'</span><span class="rt">'+['08:20','10:25','10:30','11:40','13:00','14:00','16:30'][i]+'</span>';b.addEventListener('click',()=>set(i));ls.appendChild(b)});function set(i){ns.forEach((n,j)=>n.classList.toggle('active',i===j));[...ls.children].forEach((b,j)=>b.classList.toggle('active',i===j));kind.textContent=d[i][0];title.textContent=d[i][1];copy.textContent=d[i][2];link.href=d[i][3]}ns.forEach(n=>n.addEventListener('click',()=>set(Number(n.dataset.i))));set(0)})();</script></div>
