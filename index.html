<script>(()=>{const d=[['出發','家裡 → 汐止火車站','從新台五路搭公車到汐止火車站，再搭往台北方向的臺鐵。建議 08:20 左右出發。','https://www.google.com/maps/dir/?api=1&origin=新台五路汐止&destination=汐止火車站&travelmode=transit'],['交通','台北車站 → 新北投站','臺鐵到台北後，搭淡水信義線到北投，再轉新北投支線。','https://www.google.com/maps/dir/?api=1&origin=台北車站&destination=新北投捷運站&travelmode=transit'],['早午餐','早安勇士','10:30–11:40。份量足，週六營業；熱門時段可能候位。','https://www.google.com/maps/dir/?api=1&origin=新北投捷運站&destination=早安勇士+北投&travelmode=walking'],['散步','北投公園／圖書館／溫泉博物館','11:40–13:00。景點集中，慢慢走即可。','https://www.google.com/maps/dir/?api=1&origin=早安勇士+北投&destination=北投溫泉博物館&travelmode=walking'],['景點','地熱谷','13:00–14:00。從溫泉博物館步行約 15–20 分鐘。','https://www.google.com/maps/dir/?api=1&origin=北投溫泉博物館&destination=地熱谷&travelmode=walking'],['咖啡','豆咖啡 BEANCAFE','14:00–16:30。虹吸咖啡、手沖與甜點；週六通常營業。','https://www.google.com/maps/dir/?api=1&origin=地熱谷&destination=豆咖啡+BEANCAFE+北投&travelmode=walking'],['回程','豆咖啡 → 汐止','16:30 離開，走回新北投站，搭捷運到台北再轉臺鐵，預留回家交通時間。','https://www.google.com/maps/dir/?api=1&origin=豆咖啡+BEANCAFE+北投&destination=汐止火車站&travelmode=transit']];const times=['08:20','10:25','10:30','11:40','13:00','14:00','16:30'],ns=[...document.querySelectorAll('#beitou-trip-map .node')],ls=document.getElementById('route-list'),mt=document.getElementById('mobile-timeline'),kind=document.getElementById('trip-kind'),title=document.getElementById('trip-title'),copy=document.getElementById('trip-copy'),link=document.getElementById('trip-link');d.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='mobile-step';b.innerHTML='<span class="mobile-dot">'+(i+1)+'</span><span class="mobile-copy"><span class="mobile-name">'+x[1]+'</span><span class="mobile-time">'+times[i]+' · '+x[0]+'</span></span>';b.addEventListener('click',()=>set(i));mt.appendChild(b);const r=document.createElement('button');r.type='button';r.innerHTML='<span>'+x[1]+'</span><span class="rt">'+times[i]+'</span>';r.addEventListener('click',()=>set(i));ls.appendChild(r)});function set(i){ns.forEach((n,j)=>n.classList.toggle('active',i===j));[...ls.children].forEach((b,j)=>b.classList.toggle('active',i===j));[...mt.children].forEach((b,j)=>b.classList.toggle('active',i===j));kind.textContent=d[i][0];title.textContent=d[i][1];copy.textContent=d[i][2];link.href=d[i][3]}ns.forEach(n=>n.addEventListener('click',()=>set(Number(n.dataset.i))));set(0)})();</script><script>(()=>{const map=document.querySelector('#beitou-trip-map .map'),svg=map&&map.querySelector('.route-svg');if(!map||!svg)return;const c=document.createElement('div');c.className='mobile-map-controls';c.innerHTML='<label>左右 <input id="map-pan" type="range" min="0" max="100" value="0" aria-label="左右移動地圖"></label><label>縮放 <input id="map-zoom" type="range" min="80" max="170" value="100" aria-label="縮放地圖"></label><span class="mobile-controls-note">可用手指拖曳、雙指縮放</span>';map.insertBefore(c,svg);const v=document.createElement('div');v.className='mobile-viewport';svg.parentNode.insertBefore(v,svg);v.appendChild(svg);const pan=c.querySelector('#map-pan'),zoom=c.querySelector('#map-zoom');let scale=1,x=0,startX=0,startDist=0,startScale=1;function draw(){svg.style.display='block';svg.style.transform=`translateX(${x}px) scale(${scale})`;pan.value=Math.max(0,Math.min(100,(-x/Math.max(1,svg.clientWidth*scale-v.clientWidth))*100));zoom.value=Math.round(scale*100)}function clamp(){x=Math.min(0,Math.max(v.clientWidth-svg.clientWidth*scale,x));draw()}pan.addEventListener('input',()=>{x=-(svg.clientWidth*scale-v.clientWidth)*(pan.value/100);draw()});zoom.addEventListener('input',()=>{scale=zoom.value/100;clamp()});v.addEventListener('pointerdown',e=>{startX=e.clientX-x;v.setPointerCapture(e.pointerId)});v.addEventListener('pointermove',e=>{if(e.buttons){x=e.clientX-startX;clamp()}});v.addEventListener('touchstart',e=>{if(e.touches.length===2){startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);startScale=scale}},{passive:true});v.addEventListener('touchmove',e=>{if(e.touches.length===2){const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=Math.max(.8,Math.min(1.7,startScale*dist/startDist));clamp();e.preventDefault()}},{passive:false});draw()})();</script></div>
