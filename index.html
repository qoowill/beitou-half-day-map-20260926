<!doctype html><html lang="zh-Hant"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汐止到北投半日遊互動地圖</title><style>

:700}.side-title{font-size:13px;font-weight:700;margin-bottom:8px}.list{display:grid;gap:7px}.list button{border:0;background:transparent;text-align:left;padding:8px;border-radius:10px;display:flex;justify-content:space-between;color:#263238;font:inherit;font-size:12px}.list button.active,.list button:hover{background:#f8e3d9}.rt{color:#927767;white-space:nowrap}.foot{padding:0 22px 20px;font-size:12px;color:#8a7c6d}

</style><style>.controls{display:none!important}</style><main id="app"><section class="hero"><div class="eyebrow">SATURDAY · 9/26 · HALF DAY ESCAPE</div><h1>汐止出發，去北投散步</h1><p class="sub">一條不趕路的溫泉街半日行程｜早午餐・公園・地熱谷・咖啡</p><div class="pills"><span class="pill">🚆 火車＋捷運</span><span class="pill">☕ 咖啡 2 小時</span><span class="pill">↩ 18:00 前回家</span></div></section><section class="map"><div class="map-title">今日路線</div><div class="controls"><label>左右 <input id="pan" type="range" min="0" max="100" value="0"></label><label>縮放 <input id="zoom" type="range" min="100" max="170" value="100"></label><span>手機可直接左右滑動地圖</span></div><div class="canvas" id="canvas"><svg class="route" id="route" viewBox="0 0 776 310" aria-label="汐止到北投行程路線"><path class="water" d="M0 250C160 200 270 275 430 228S650 205 776 240V310H0Z"/><path class="road" d="M45 220C125 120 185 105 265 160S375 260 450 180S570 85 730 125"/><path class="line" d="M45 220C125 120 185 105 265 160S375 260 450 180S570 85 730 125"/><text x="80" y="275" class="landmark">🚆</text><text x="680" y="70" class="landmark">♨</text><g class="node active" data-i="0" transform="translate(45 220)"><circle class="dot" r="18"/><text class="num">1</text><text class="label" x="-12" y="-30">汐止</text><text class="time" x="-12" y="-17">08:20</text></g><g class="node" data-i="1" transform="translate(175 110)"><circle class="dot" r="18"/><text class="num">2</text><text class="label" x="-18" y="-30">新北投</text><text class="time" x="-18" y="-17">10:25</text></g><g class="node" data-i="2" transform="translate(265 160)"><circle class="dot" r="18"/><text class="num">3</text><text class="label" x="-20" y="-30">早安勇士</text><text class="time" x="-20" y="-17">10:30</text></g><g class="node" data-i="3" transform="translate(370 260)"><circle class="dot" r="18"/><text class="num">4</text><text class="label" x="-28" y="35">公園／博物館</text><text class="time" x="-28" y="48">11:40</text></g><g class="node" data-i="4" transform="translate(450 180)"><circle class="dot" r="18"/><text class="num">5</text><text class="label" x="-16" y="-30">地熱谷</text><text class="time" x="-16" y="-17">13:00</text></g><g class="node" data-i="5" transform="translate(570 85)"><circle class="dot" r="18"/><text class="num">6</text><text class="label" x="-16" y="-30">豆咖啡</text><text class="time" x="-16" y="-17">14:00</text></g><g class="node" data-i="6" transform="translate(730 125)"><circle class="dot" r="18"/><text class="num">7</text><text class="label" x="-28" y="-30">回汐止</text><text class="time" x="-28" y="-17">16:30</text></g></svg></div></section><section class="info"><div class="panel"><div class="kind" id="kind">出發</div><h2 id="title">家裡 → 汐止火車站</h2><p id="copy">從新台五路搭公車到汐止火車站，再搭往台北方向的臺鐵。建議 08:20 左右出發。</p><a class="go" id="link" target="_blank" rel="noopener">開啟這一段導航 ↗</a></div><div class="panel"><div class="side-title">行程節奏</div><div class="list" id="list"></div></div></section><div class="foot">☔ 明日上午 10–11 點可能有短暫陣雨，帶傘；建議 16:30 前回到新北投站，18:00 前回家。</div></main><script>
(()=>{const d=[['出發','家裡 → 汐止火車站','從新台五路搭公車到汐止火車站，再搭往台北方向的臺鐵。建議 08:20 左右出發。','https://www.google.com/maps/dir/?api=1&origin=新台五路汐止&destination=汐止火車站&travelmode=transit'],['交通','台北車站 → 新北投站','臺鐵到台北後，搭淡水信義線到北投，再轉新北投支線。','https://www.google.com/maps/dir/?api=1&origin=台北車站&destination=新北投捷運站&travelmode=transit'],['早午餐','早安勇士','10:30–11:40。份量足，週六營業；熱門時段可能候位。','https://www.google.com/maps/dir/?api=1&origin=新北投捷運站&destination=早安勇士+北投&travelmode=walking'],['散步','北投公園／圖書館／溫泉博物館','11:40–13:00。景點集中，慢慢走即可。','https://www.google.com/maps/dir/?api=1&origin=早安勇士+北投&destination=北投溫泉博物館&travelmode=walking'],['景點','地熱谷','13:00–14:00。從溫泉博物館步行約 15–20 分鐘。','https://www.google.com/maps/dir/?api=1&origin=北投溫泉博物館&destination=地熱谷&travelmode=walking'],['咖啡','豆咖啡 BEANCAFE','14:00–16:30。虹吸咖啡、手沖與甜點；週六通常營業。','https://www.google.com/maps/dir/?api=1&origin=地熱谷&destination=豆咖啡+BEANCAFE+北投&travelmode=walking'],['回程','豆咖啡 → 汐止','16:30 離開，走回新北投站，搭捷運到台北再轉臺鐵。','https://www.google.com/maps/dir/?api=1&origin=豆咖啡+BEANCAFE+北投&destination=汐止火車站&travelmode=transit']],t=['08:20','10:25','10:30','11:40','13:00','14:00','16:30'],route=document.getElementById('route'),canvas=document.getElementById('canvas'),pan=document.getElementById('pan'),zoom=document.getElementById('zoom'),list=document.getElementById('list'),nodes=[...document.querySelectorAll('.node')],state={x:0,s:1};function draw(){route.style.transform=`translateX(${state.x}px) scale(${state.s})`;pan.value=Math.max(0,Math.min(100,(-state.x/Math.max(1,776*state.s-776))*100));zoom.value=state.s*100}pan.oninput=()=>{state.x=-(776*state.s-776)*(pan.value/100);draw()};zoom.oninput=()=>{state.s=zoom.value/100;state.x=Math.min(0,state.x);draw()};d.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML='<span>'+x[1]+'</span><span class="rt">'+t[i]+'</span>';b.onclick=()=>set(i);list.appendChild(b)});function set(i){nodes.forEach((n,j)=>n.classList.toggle('active',i===j));[...list.children].forEach((b,j)=>b.classList.toggle('active',i===j));kind.textContent=d[i][0];title.textContent=d[i][1];copy.textContent=d[i][2];link.href=d[i][3]}nodes.forEach(n=>n.onclick=()=>set(+n.dataset.i));set(0);draw()})();
</script></html>
